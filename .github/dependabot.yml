# Dependabot: mở PR khi có bản mới của GitHub Actions (đang khoá theo SHA) và gói NuGet
# (Central Package Management qua Directory.Packages.props). Mỗi tuần một lần, gộp theo nhóm.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    # SDK nhắm net8.0 và giữ Microsoft.Extensions.* / System.Text.Json ở dòng 8.x để ứng dụng .NET 8
    # dùng được; lên major (9.x, 10.x) sẽ ép ứng dụng nâng theo — chỉ nhận bản minor/patch.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.Mvc.Testing"
        update-types: ["version-update:semver-major"]
    groups:
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*", "System.Text.Json"]
      test-tooling:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet*", "Microsoft.AspNetCore.Mvc.Testing"]
    commit-message:
      prefix: deps
