name: release

# CHƯA DÙNG: không phát hành gì lên nuget.org cho tới khi ký thật được với Viettel (spec mục 8, mốc 2).
# Không gắn tag "v*" và không chạy workflow này trước khi chủ dự án chốt.
on:
  push:
    tags:
      - "v*"

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    environment: nuget-publish
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Derive version
        id: ver
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore ViettelConnect.slnx

      - name: Build
        run: dotnet build ViettelConnect.slnx --no-restore --configuration Release -p:Version=${{ steps.ver.outputs.version }}

      - name: Unit tests
        run: dotnet test tests/ViettelConnect.MySign.UnitTests/ViettelConnect.MySign.UnitTests.csproj --no-build --configuration Release

      - name: Integration tests (fake server)
        run: dotnet test tests/ViettelConnect.MySign.IntegrationTests/ViettelConnect.MySign.IntegrationTests.csproj --no-build --configuration Release

      - name: Pack (MySign)
        run: dotnet pack src/ViettelConnect.MySign.Client/ViettelConnect.MySign.Client.csproj --configuration Release -p:Version=${{ steps.ver.outputs.version }} -o artifacts

      - name: NuGet login (OIDC -> temp API key)
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ChuKhaLi

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > RELEASE_NOTES.md
          gh release create "v$VERSION" \
            --title "ViettelConnect.MySign $VERSION" \
            --notes-file RELEASE_NOTES.md \
            artifacts/*.nupkg artifacts/*.snupkg

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: artifacts/*.nupkg
